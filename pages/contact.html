<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Contact Us</title>

    <meta name="description" content="Contact ShopEase for product queries, support and feedback.">

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/contact.css">

</head>


<body>


    <!-- Navbar -->
    <div id="navbar"></div>



    <main>


        <section class="contact-section">


            <header class="section-header">

                <h1>
                    Contact Us
                </h1>

                <p>
                    Have a question? We would love to hear from you.
                </p>

            </header>



            <div class="contact-container">



                <!-- Contact Form -->

                <form id="contact-form" class="contact-form" novalidate>


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>


                        <input type="text" id="name" name="name" placeholder="Enter your name">


                        <small class="error"></small>

                    </div>





                    <div class="form-group">


                        <label for="email">
                            Email Address
                        </label>


                        <input type="email" id="email" name="email" placeholder="Enter your email">


                        <small class="error"></small>


                    </div>





                    <div class="form-group">


                        <label for="message">
                            Your Query
                        </label>


                        <textarea id="message" name="message" rows="5" placeholder="Write your query">
                        </textarea>


                        <small class="error"></small>


                    </div>




                    <button type="submit" class="btn">

                        Send Message

                    </button>



                    <p id="form-status">
                    </p>



                </form>





                <!-- Newsletter -->


                <aside class="newsletter">


                    <h2>
                        Subscribe Newsletter
                    </h2>


                    <p>
                        Get updates about new products and offers.
                    </p>



                    <form id="newsletter-form">


                        <label for="newsletter-email">
                            Email
                        </label>


                        <input type="email" id="newsletter-email" placeholder="Enter email">


                        <small class="error"></small>



                        <button class="btn" type="submit">

                            Subscribe

                        </button>


                        <p id="newsletter-status"></p>


                    </form>


                </aside>



            </div>


        </section>


    </main>





    <footer class="footer">

        <p>
            © 2026 ShopEase. All rights reserved.
        </p>

    </footer>

    <div id="theme-toggle-container"></div>


    <script type="module" src="../js/modules/contact.js"></script>
    <script type="module" src="../js/main.js"></script>

</body>

</html>
