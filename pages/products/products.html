<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Products | ShopEase</title>


    <meta name="description"
        content="Browse ShopEase premium products including electronics, fashion and lifestyle items.">


    <link rel="icon" type="image/png" href="../../assests/logo.png">


    <link rel="stylesheet" href="../../css/products.css">
    <link rel="stylesheet" href="../../css/main.css">
</head>



<body>


    <!-- Common Navbar -->
    <div id="navbar"></div>



    <main>


        <section class="products-page">


            <header class="section-header">

                <h1>
                    Our Products
                </h1>


                <p>
                    Discover products from our latest collection.
                </p>


            </header>



            <!-- Search and Filter -->

            <div class="product-controls">


                <input type="search" id="search-product" placeholder="Search products..." aria-label="Search products">



                <select id="category-filter">


                    <option value="all">
                        All Categories
                    </option>


                    <option value="electronics">
                        Electronics
                    </option>


                    <option value="jewelery">
                        Jewelry
                    </option>


                    <option value="men's clothing">
                        Men's Clothing
                    </option>


                    <option value="women's clothing">
                        Women's Clothing
                    </option>


                </select>


            </div>




            <p id="loading">
                Loading products...
            </p>




            <div class="product-grid" id="product-container">

            </div>



        </section>


    </main>




    <footer class="footer">

        <p>
            © 2026 ShopEase. All rights reserved.
        </p>

    </footer>
    <div id="theme-toggle-container"></div>




    <script type="module" src="../../js/main.js"></script>


</body>

</html>
